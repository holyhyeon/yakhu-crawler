name: Community bounded crawl

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Source to crawl (scheduled runs crawl Inven and Bobaedream)'
        required: false
        default: 'inven'
        type: choice
        options:
          - 'inven'
          - 'bobaedream'
          - 'all'
      pages:
        description: 'Number of recent pages (1-4)'
        required: false
        default: '4'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'

concurrency:
  group: community-crawl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      YAKHU_SITE_URL: ${{ secrets.YAKHU_SITE_URL }}
      YAKHU_INGEST_SECRET: ${{ secrets.YAKHU_INGEST_SECRET }}
      CRAWL_SOURCE: ${{ inputs.source || 'all' }}
      CRAWL_PAGES: ${{ inputs.pages || '4' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Crawl and ingest
        run: npm run crawl
