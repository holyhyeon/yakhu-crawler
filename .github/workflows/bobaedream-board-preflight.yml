            return { board, url: cfg.list, status, httpStatus: r.status, finalUrl: r.url, contentType: r.contentType, responseBytes: r.size, htmlTitle: titleOf(r.html), realBoardHtml: html && boardPosts > 0, loginRequired: listAuthSignal || detailChecks.some((item) => item.loginRequired), ageGate: (listAuthSignal && /성인|19세|본인/i.test(r.html)) || detailChecks.some((item) => item.ageGate), challenge: isChallenge, postsDetected: boardPosts, listAuthSignal, detailSuccess, detailChecks };
          }
