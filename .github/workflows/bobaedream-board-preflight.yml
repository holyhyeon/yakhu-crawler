              const dAuthRedirect = /(?:login|logincheck|auth|adult|age)/i.test(d.url);
              const dHardAuth = dAuthSignal && dMedia.length === 0 && dAuthRedirect;
              detailChecks.push({ url: post.url, status: d.status, finalUrl: d.url, contentType: d.contentType, responseBytes: d.size, htmlTitle: titleOf(d.html), ok: d.status >= 200 && d.status < 300 && dHtml && !dChallenge, mediaCount: dMedia.length, loginRequired: dAuthSignal, ageGate: dAuthSignal && /성인|19세|본인/i.test(d.html), authRedirect: dAuthRedirect, challenge: dChallenge, hardAuth: dHardAuth });
