          }
          async function yieldBoard(board) {
            const cfg = SOURCES[board]; const map = new Map(); let listFetchSuccess = 0; let listFetchFailure = 0; let duplicates = 0; let discovered = 0; let noiseExcluded = 0; let challengeCount = 0;
            for (let page = 1; page <= 15 && map.size < MAX_POSTS; page++) {
