              || source.match(/<div\b[^>]*(?:id|class)=["'][^"']*conView[^"']*["'][^>]*>([\s\S]*?)<\/div>/i)?.[1]
              || source;
            return plain(focused).slice(0, 12000);
          }
          const NEGATIVE = ['미성년','청소년','10대','학생','여고생','교복','아동','소녀','소년','로리','몰카','도촬','불법촬영','유출','딥페이크','그림','일러스트','팬아트','창작','캐릭터','애니','애니메이션','만화','웹툰','게임','인게임','게임 스크린샷','게임 캐릭터','스킨','원화','콘셉트아트','코스튬 이미지','카톡','문자','메시지 캡처','채팅 캡처','커뮤니티 캡처','스크린샷','캡처','밈','짤방','디시콘','스티커','낙서','2D','탑툰'];
          const escapeRegExp = (s) => s.replace(/[.*+?^$()|[\]\\{}]/g, '\\$&');
          const NEGATIVE_PATTERN = new RegExp('(?:' + NEGATIVE.map(escapeRegExp).join('|') + ')', 'i');
          const TECHNICAL_OR_NEWS = [/(?:open\s*ai|gpt|llm|언어\s*모델|차세대\s*모델|내부\s*모델|신형\s*모델|소프트웨어\s*모델|제품\s*모델|자동차\s*모델|차량\s*모델|기기\s*모델)/i,/(?:ai\s*(?:배우|모델|사진|이미지)|채널\s*a|할리우드|징병|정책|법안|국회|정치|사회\s*이슈|뉴스|논란|사건)/i,/(?:임신|소방관|역사상|인류\s*역사|가장\s*오래된|남자\s*신체|신체\s*비밀)/i];
          const WEAK_TITLE = /(ㅇㅎ|ㅎㅂ|약후|후방|후방주의|야짤)/i;
          const STRONG_TARGET_CONTEXT = [/비키니|수영복|모노키니|란제리|브라렛|시스루|여친룩|파티룩|비치웨어/i,/화보|그라비아|맥심|바디\s*프로필|룩북|치어리더|레이싱\s*모델|피팅\s*모델/i,/여캠|인플루언서|아나운서|성인\s*배우|여배우|아이돌|걸그룹|bj|스트리머|댄서/i,/실사\s*(?:사진|인물|여성)|실제\s*인물|여성\s*모델|패션\s*모델|비키니\s*모델|맥심\s*모델/i];
          const SOCIAL_CONTEXT = /인스타|셀카|직캠|릴스|틱톡/i;
          const PERSON_CONTEXT = /여성|여자|여캠|눈나|누나|치어리더|인플루언서|아나운서|여배우|가수|아이돌|걸그룹|bj|스트리머|댄서|배우/i;
          const BODY_CONTEXT = /몸매|피지컬|골반|각선미|복근|가슴|폭유|슬랜더/i;
          const COSPLAY_CONTEXT = /코스프레/i;
          const MODEL_CONTEXT = /레이싱\s*모델|여성\s*모델|패션\s*모델|화보\s*모델|비키니\s*모델|맥심\s*모델|피팅\s*모델|모델\s*(?:화보|촬영|사진|출사)/i;
          function qualityGate(title, source, body) {
            if (source === 'MAXIM B-CUT' || source === 'maxim') return { decision: 'accept', reason: 'trusted_source' };
            const titleValue = String(title || '').toLocaleLowerCase('ko-KR');
            const value = (String(title || '') + '\n' + String(body || '')).toLocaleLowerCase('ko-KR').trim();
            if (!value) return { decision: 'reject', reason: 'empty_context' };
            if (NEGATIVE_PATTERN.test(value)) return { decision: 'reject', reason: 'negative_context' };
            if (TECHNICAL_OR_NEWS.some((pattern) => pattern.test(value))) return { decision: 'reject', reason: 'technical_or_news' };
            if (value.includes('모델') && !MODEL_CONTEXT.test(value) && !STRONG_TARGET_CONTEXT.some((pattern) => pattern.test(value))) return { decision: 'review', reason: 'ambiguous_model_context' };
            if (value.includes('배우') && !/성인\s*배우|여배우|화보|인스타|비키니|수영복/i.test(value)) return { decision: 'review', reason: 'ambiguous_actor_context' };
            if (STRONG_TARGET_CONTEXT.some((pattern) => pattern.test(value))) return { decision: 'accept', reason: 'strong_target_signal' };
            if (WEAK_TITLE.test(titleValue)) { if (SOCIAL_CONTEXT.test(value)) return { decision: 'accept', reason: 'weak_marker_with_social_context' }; return { decision: 'review', reason: 'weak_only' }; }
            if (PERSON_CONTEXT.test(value) || BODY_CONTEXT.test(value) || MODEL_CONTEXT.test(value) || COSPLAY_CONTEXT.test(value)) return { decision: 'review', reason: 'ambiguous_context' };
            return { decision: 'reject', reason: 'no_target_signal' };
          }
          const CLASS_NEGATIVE = /미성년|청소년|교복|아동|몰카|도촬|유출|딥페이크|그림|일러스트|팬아트|애니|만화|게임|스크린샷|캡처|카톡|문자|밈|짤방|디시콘|스티커|정치|사건|뉴스|광고|제품|남자|남성|공지|이벤트/i;
          const CLASS_STRONG = /비키니|수영복|화보|그라비아|맥심|치어리더|레이싱\s*모델|여캠|인플루언서|아나운서|성인\s*배우|여배우|아이돌|걸그룹|여성\s*모델|패션\s*모델|바디\s*프로필|룩북|직캠|셀카|인스타|여친룩|몸매|골반|각선미|실사\s*(?:사진|인물)/i;
          const CLASS_PERSON = /여성|여자|누나|눈나|배우|가수|아이돌|모델|인스타|셀카|사진|화보|직캠|치어리더|레이싱/i;
          function manualClassify(board, title, body, mediaCount) {
            const text = String(title || '') + '\n' + String(body || '');
            if (!mediaCount) return { label: 'NON_TARGET', reason: 'no_media' };
            if (CLASS_NEGATIVE.test(text)) return { label: 'NON_TARGET', reason: 'negative_context' };
            if (CLASS_STRONG.test(text) && !/뉴스|사건|정치|광고|공지|이벤트/i.test(text)) return { label: 'TARGET', reason: 'visual_women_signal' };
            if (board === 'girl' && /모델|레이싱|화보|사진|직캠|인스타|셀카|여성|여자/i.test(text)) return { label: 'TARGET', reason: 'girl_board_visual_context' };
            if (CLASS_PERSON.test(text) || board === 'nsfw') return { label: 'AMBIGUOUS', reason: 'needs_visual_review' };
            return { label: 'NON_TARGET', reason: 'no_target_signal' };
          }
          async function mapLimit(items, limit, worker) { const out = new Array(items.length); let next = 0; async function run() { while (true) { const i = next++; if (i >= items.length) return; out[i] = await worker(items[i], i); } } await Promise.all(Array.from({ length: Math.min(limit, items.length) }, run)); return out; }
          async function accessProbe(board) {
            const cfg = SOURCES[board];
            const r = await get(cfg.list, cfg.list);
