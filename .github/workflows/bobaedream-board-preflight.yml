name: Bobaedream board preflight (manual)

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'access probes the two exact boards; yield samples one board'
        required: true
        default: 'access'
        type: choice
        options:
          - 'access'
          - 'yield'
      board:
        description: 'Exact Bobaedream board'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'nsfw'
          - 'girl'

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PHASE: ${{ inputs.phase || 'access' }}
      BOARD: ${{ inputs.board || 'both' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe exact Bobaedream board
        shell: bash
        run: |
          cat > /tmp/bobaedream-board-preflight.mjs <<'NODE'
          const UA = 'Mozilla/5.0 (compatible; YakhuArchiveCrawler/0.1; personal archive)';
          const TIMEOUT = 12000;
          const DELAY = 250;
          const MAX_POSTS = 150;
          const SOURCES = {
            nsfw: { code: 'nsfw', list: 'https://www.bobaedream.co.kr/list?code=nsfw' },
            girl: { code: 'girl', list: 'https://www.bobaedream.co.kr/list?code=girl' },
          };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const decode = (s) => String(s || '').replace(/&amp;/gi, '&').replace(/&quot;/gi, '"').replace(/&#39;|&apos;/gi, "'").replace(/&nbsp;/gi, ' ');
          const plain = (s) => decode(s).replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, ' ').replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
          const attr = (s, name) => { const marker = name + '='; const value = String(s || ''); const i = value.toLowerCase().indexOf(marker.toLowerCase()); if (i < 0) return ''; const tail = value.slice(i + marker.length).trimStart(); const quote = tail[0]; if (quote !== '"' && quote !== "'") return ''; const j = tail.indexOf(quote, 1); return j > 0 ? decode(tail.slice(1, j)) : ''; };
          const abs = (raw, base) => { try { return new URL(decode(raw), base).href; } catch { return null; } };
          const challenge = (status, html) => status === 401 || status === 403 || status === 429 || /captcha|cloudflare|ddos|security\s*check|접근\s*제한|성인\s*(?:인증|전용)|본인\s*인증|로그인\s*후/i.test((html.match(/<title[^>]*>[\s\S]*?<\/title>/i)?.[0] || '') + String(html || '').slice(0, 5000));
          const authGate = (html) => /(?:로그인(?:을|이)?\s*(?:해야|후(?:에)?\s*(?:이용|확인|열람)|필요)|회원\s*(?:전용|만)|성인\s*(?:인증|확인)\s*(?:이\s*)?(?:필요|후|완료)|19세\s*(?:이상\s*)?(?:인증|확인)\s*(?:이\s*)?(?:필요|후|완료))/i.test(plain(String(html || '').slice(0, 20000)));
          async function get(url, referer, extraHeaders = {}) {
            try {
              const headers = { 'user-agent': UA, 'accept-language': 'ko-KR,ko;q=0.9', ...extraHeaders };
              if (referer) headers.referer = referer;
              const response = await fetch(url, { headers, redirect: 'follow', signal: AbortSignal.timeout(TIMEOUT) });
              const buffer = await response.arrayBuffer();
              const html = new TextDecoder('utf-8').decode(buffer);
              return { status: response.status, url: response.url, contentType: response.headers.get('content-type') || '', size: buffer.byteLength, html };
            } catch (error) { return { status: 0, url, contentType: '', size: 0, html: '', error: error.message }; }
          }
          function titleOf(html) { return plain(html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1] || '').slice(0, 200); }
          function parseDate(text) {
            const m = String(text || '').match(/(20\d{2})[.\/-](\d{1,2})[.\/-](\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?/);
            if (!m) return null;
            const d = new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]), Number(m[4] || 0), Number(m[5] || 0)));
            return Number.isFinite(d.getTime()) ? d.toISOString() : null;
          }
          function noiseTitle(title, url) { return /(?:^|[\s\[【])공지|운영\s*규정|이벤트|이용\s*안내|광고|협찬|파트너|배너|프로모션/i.test(String(title || '') + ' ' + String(url || '')); }
          function parsePosts(html, base, cfg) {
            const map = new Map();
            for (const m of String(html || '').matchAll(/<a\b([^>]*)>([\s\S]*?)<\/a>/gi)) {
              const rawHref = attr(m[1], 'href');
              const href = abs(rawHref, base);
              if (!href) continue;
              let u;
              try { u = new URL(href); } catch { continue; }
              if (!/\/view(?:\.php)?$/i.test(u.pathname)) continue;
              const code = u.searchParams.get('code');
              const no = u.searchParams.get('No') || u.searchParams.get('no');
              if (code !== cfg.code || !no) continue;
              const key = code + ':' + no;
              const title = plain(m[2]).replace(/\s+/g, ' ').trim() || '게시물 ' + no;
              const row = { key, code, no, url: 'https://www.bobaedream.co.kr/view?code=' + encodeURIComponent(code) + '&No=' + encodeURIComponent(no), title, noise: noiseTitle(title, href), listDate: parseDate(plain(m[0])) };
              const old = map.get(key);
              if (!old || title.length > old.title.length) map.set(key, row);
            }
            return [...map.values()];
          }
          function mediaUrls(html, base) {
            const out = [];
            for (const tag of String(html || '').matchAll(/<(?:img|video|source|a)\b[^>]*>/gi)) {
              for (const m of tag[0].matchAll(/(?:src|data-src|data-original|href)=["']([^"']+)["']/gi)) {
                const url = abs(m[1], base);
                if (!url || /^(?:data:|javascript:)/i.test(url) || /mycar_photo_request|partner_photo|\/mycar\/|\/partner\/|no_image\.gif/i.test(url)) continue;
                if (/logo|icon|avatar|emoji|favicon|banner|advert|sponsor|btn_|button/i.test(url)) continue;
                if (/\.(?:jpe?g|png|gif|webp|avif|mp4|webm)(?:[?#]|$)/i.test(url) || /(?:upload|attach|image|img|media|files|photo|thumbnail)/i.test(url)) out.push(url);
              }
            }
