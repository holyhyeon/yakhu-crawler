name: Boba pattern probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YAKHU_SITE_URL: ${{ secrets.YAKHU_SITE_URL }}
      YAKHU_INGEST_SECRET: ${{ secrets.YAKHU_INGEST_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fixture tests
        run: npm run test:fixture
      - name: Boba 4-page canary
        run: node boba-canary.mjs
