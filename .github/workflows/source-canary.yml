name: Source bounded canary

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source'
        required: true
        default: inven
        type: choice
        options: [inven, bobaedream, inven-model]
      mode:
        description: 'baseline or expanded'
        required: true
        default: baseline
        type: choice
        options: [baseline, expanded]

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      YAKHU_SITE_URL: ${{ secrets.YAKHU_SITE_URL }}
      YAKHU_INGEST_SECRET: ${{ secrets.YAKHU_INGEST_SECRET }}
      CANARY_SOURCE: ${{ inputs.source }}
      CANARY_MODE: ${{ inputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run bounded canary
        run: node scripts/source-canary.mjs

