name: Inven cosplay model board preflight
on:
  workflow_dispatch:
    inputs:
      pages:
        description: Recent list pages to sample
        required: false
        default: '10'
        type: string
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe public Inven cosplay model board
        run: |
          node <<'NODE'
          const LIST='https://m.inven.co.kr/board/webzine/2898?category=%EA%B2%8C%EC%9E%84%EB%AA%A8%EB%8D%B8';
          const UA='Mozilla/5.0 (compatible; MeuheutPublicPreflight/1.0)';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(url,ref=LIST){const r=await fetch(url,{headers:{'user-agent':UA,'accept-language':'ko-KR,ko;q=0.9',referer:ref},redirect:'follow',signal:AbortSignal.timeout(15000)});return {url:r.url,status:r.status,type:r.headers.get('content-type')||'',html:await r.text()};}
          const dec=s=>String(s||'').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
          const abs=(u,b)=>{try{return new URL(u,b).href}catch{return null}};
          function list(html,base){const m=new Map();for(const x of html.matchAll(/<a\b[^>]*href=["']([^"']*\/board\/webzine\/2898\/(\d+))[^>]*>([\s\S]*?)<\/a>/gi)){const id=x[2],title=dec(x[3]).replace(/\[[^\]]*\]$/,'').trim().slice(0,180);if(id&&title&&!m.has(id))m.set(id,{id,title,url:abs(x[1],base)});}return [...m.values()]}
          function media(html,page){const urls=[];for(const x of html.matchAll(/<img\b[^>]*(?:src|data-src|data-original)=["']([^"']+)["'][^>]*>/gi)){const u=abs(x[1],page);if(u&&!/logo|icon|avatar|banner|ad[s_\/-]|copyright|emoji|profile/i.test(u)&&!urls.includes(u))urls.push(u);}return urls}
          const classify=(t,n)=>{if(!n)return'NON_TARGET';if(/공지|이벤트|모집|남자|남성|풍경|게임뉴스|스크린샷|인게임/i.test(t)&&!/(모델|화보|코스프레|수영복|비키니|레이싱|치어|여성|여자)/i.test(t))return'NON_TARGET';if(/모델|화보|코스프레|수영복|비키니|레이싱|치어|촬영|스튜디오|드레스/i.test(t))return'TARGET';if(/게임|애니|캐릭터|소녀|니케|원신|롤|리그|붕괴|메이플/i.test(t))return'AMBIGUOUS';return'AMBIGUOUS'};
          const pageCap=10,urls=[LIST,...Array.from({length:pageCap-1},(_,i)=>LIST+'&p='+(i+2))],listResults=[],all=new Map();
          for(const u of urls){try{const r=await get(u);listResults.push({url:r.url,status:r.status,type:r.type,bytes:Buffer.byteLength(r.html)});if(r.status>=200&&r.status<300)for(const x of list(r.html,r.url))all.set(x.id,x)}catch(e){listResults.push({url:u,error:String(e.message||e)})}await sleep(150)}
          const items=[...all.values()].slice(0,180),rows=[];let detailFailure=0;
          for(const x of items){await sleep(120);try{const r=await get(x.url,x.url);if(r.status<200||r.status>=300)throw Error('status_'+r.status);const ms=media(r.html,r.url);rows.push({...x,mediaCount:ms.length,media:ms.slice(0,3),classification:classify(x.title,ms.length)})}catch(e){detailFailure++;rows.push({...x,classification:'DETAIL_ERROR',error:String(e.message||e)})}}
          const counts={TARGET:0,AMBIGUOUS:0,NON_TARGET:0,DETAIL_ERROR:0};for(const r of rows)counts[r.classification]=(counts[r.classification]||0)+1;
          const titles=k=>rows.filter(r=>r.classification===k).slice(0,12).map(r=>({title:r.title,url:r.url,mediaCount:r.mediaCount}));
          let mediaChecks=[];for(const r of rows.filter(x=>x.mediaCount>0).slice(0,5)){const u=r.media[0];try{const z=await fetch(u,{headers:{'user-agent':UA,referer:r.url},redirect:'follow',signal:AbortSignal.timeout(15000)});mediaChecks.push({post:r.id,status:z.status,type:z.headers.get('content-type')||'',url:z.url})}catch(e){mediaChecks.push({post:r.id,error:String(e.message||e)})}}
          console.log(JSON.stringify({source:'inven',board:'webzine/2898?category=게임모델',runtime:'ubuntu-latest Node 22 native fetch',listRequests:urls.length,listFailures:listResults.filter(x=>x.error||x.status>=400).length,listResults,sampled:rows.length,detailSuccess:rows.length-detailFailure,detailFailure,counts,targetTitles:titles('TARGET'),ambiguousTitles:titles('AMBIGUOUS'),nonTargetTitles:titles('NON_TARGET'),mediaChecks},null,2));
          NODE
