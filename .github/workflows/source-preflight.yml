name: SLR model gallery preflight
on:
  workflow_dispatch:
    inputs:
      pages:
        description: Recent list pages to sample
        required: false
        default: '10'
        type: string
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe public SLR model gallery
        run: |
          node <<'NODE'
          const LIST='https://m.slrclub.com/l/theme_gallery/C3';
          const UA='Mozilla/5.0 (compatible; MeuheutPublicPreflight/1.0)';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(url,ref=LIST){const r=await fetch(url,{headers:{'user-agent':UA,'accept-language':'ko-KR,ko;q=0.9',referer:ref},redirect:'follow',signal:AbortSignal.timeout(15000)});return {url:r.url,status:r.status,type:r.headers.get('content-type')||'',html:await r.text()};}
          const dec=s=>String(s||'').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
          const abs=(u,b)=>{try{return new URL(u,b).href}catch{return null}};
          function list(html,base=LIST){const m=new Map();for(const x of html.matchAll(/<a\b[^>]*href=["']([^"']*\/v\/theme_gallery\/C3\/(\d+))[^>]*>([\s\S]*?)<\/a>/gi)){const id=x[2],title=dec(x[3]).slice(0,160);if(id&&title&&!m.has(id))m.set(id,{id,title,url:abs(x[1],base)||'https://m.slrclub.com/v/theme_gallery/C3/'+id});}return [...m.values()]}
          function pageLinks(html,base=LIST){return [...new Set([...html.matchAll(/<a\b[^>]*href=["']([^"']*\/l\/theme_gallery\/C3\/\d+)[^"']*\/?>/gi)].map(x=>abs(x[1],base)).filter(Boolean))]}
          function media(html,page){const low=html.toLowerCase(),mark=low.indexOf('userct'),end=low.indexOf('comment',Math.max(0,mark)),scope=mark>=0?html.slice(mark,end>mark?end:mark+250000):html,urls=[];for(const x of scope.matchAll(/<(?:img|video|source)\b[^>]*(?:src|data-src|data-original)=["']([^"']+)["'][^>]*>/gi)){const u=abs(x[1],page);if(u&&!/logo|icon|avatar|banner|ad[s_\/-]|copyright/i.test(u)&&!urls.includes(u))urls.push(u);}return urls}
          const classify=(t,n)=>{if(!n)return'NON_TARGET';if(/공지|광고|이벤트|자동차|차량|카메라|렌즈|장비|남자|남성|소년|아이|가족|동물|풍경|꽃|음식|제품|건물|야경|일출|조류/i.test(t)&&!/(모델|패션|화보|비키니|수영복|드레스|레이싱|치어|여성|여자|인물|언더웨어|한복)/i.test(t))return'NON_TARGET';if(/모델|패션|화보|출사|촬영|스튜디오|비키니|수영복|드레스|패션위크|모터쇼|레이싱|치어|그녀|여성|여자|인물|바디프로필|언더웨어|한복/i.test(t))return'TARGET';return'AMBIGUOUS'};
          const pageCap=10,first=await get(LIST),listUrls=[LIST,...pageLinks(first.html).slice(0,pageCap-1)],listResults=[{url:first.url,status:first.status,type:first.type,bytes:Buffer.byteLength(first.html)}];
          for(let i=1;i<listUrls.length;i++){await sleep(150);try{const r=await get(listUrls[i]);listResults.push({url:r.url,status:r.status,type:r.type,bytes:Buffer.byteLength(r.html)})}catch(e){listResults.push({url:listUrls[i],error:String(e.message||e)})}}
          const all=new Map();for(let i=0;i<listUrls.length;i++){try{const r=i?await get(listUrls[i]):first;for(const x of list(r.html,r.url))all.set(x.id,x)}catch{}}
          const items=[...all.values()].slice(0,180),rows=[];let detailFailure=0;
          for(let i=0;i<items.length;i++){const x=items[i];await sleep(120);try{const r=await get(x.url,x.url);if(r.status<200||r.status>=300)throw Error('status_'+r.status);const ms=media(r.html,r.url);rows.push({...x,mediaCount:ms.length,media:ms.slice(0,3),classification:classify(x.title,ms.length)})}catch(e){detailFailure++;rows.push({...x,classification:'DETAIL_ERROR',error:String(e.message||e)})}}
          const counts={TARGET:0,AMBIGUOUS:0,NON_TARGET:0,DETAIL_ERROR:0};for(const r of rows)counts[r.classification]=(counts[r.classification]||0)+1;
          const titles=k=>rows.filter(r=>r.classification===k).slice(0,10).map(r=>({title:r.title,url:r.url,mediaCount:r.mediaCount}));
          let mediaChecks=[];for(const r of rows.filter(x=>x.mediaCount>0).slice(0,5)){for(const u of r.media.slice(0,1)){try{const z=await fetch(u,{headers:{'user-agent':UA,referer:r.url},redirect:'follow',signal:AbortSignal.timeout(15000)});mediaChecks.push({post:r.id,status:z.status,type:z.headers.get('content-type')||'',url:z.url})}catch(e){mediaChecks.push({post:r.id,error:String(e.message||e)})}}}
          console.log(JSON.stringify({source:'slrclub',board:'theme_gallery/C3',runtime:'ubuntu-latest Node 22 native fetch',listRequests:listUrls.length,listFailures:listResults.filter(x=>x.error||x.status>=400).length,listResults,sampled:rows.length,detailSuccess:rows.length-detailFailure,detailFailure,counts,targetTitles:titles('TARGET'),ambiguousTitles:titles('AMBIGUOUS'),nonTargetTitles:titles('NON_TARGET'),mediaChecks},null,2));
          NODE
