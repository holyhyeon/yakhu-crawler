name: Source preflight (temporary)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: preflight or sample
        required: false
        default: preflight
        type: choice
        options: [preflight, sample]
      source:
        description: Comma-separated source ids or all
        required: false
        default: all
        type: string
      limit:
        description: Sample size (100-200)
        required: false
        default: '120'
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREFLIGHT_MODE: ${{ inputs.mode || 'preflight' }}
      PREFLIGHT_SOURCE: ${{ inputs.source || 'all' }}
      PREFLIGHT_LIMIT: ${{ inputs.limit || '120' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run public access probe
        run: node scripts/source-preflight.mjs
