name: Source preflight (manual)

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'preflight probes all candidates; yield samples one PASS source'
        required: true
        default: 'preflight'
        type: choice
        options:
          - 'preflight'
          - 'yield'
      source:
        description: 'Source to sample when phase is yield'
        required: false
        default: 'ppomppu'
        type: choice
        options:
          - 'ppomppu'
          - 'bobaedream'
          - 'mlbpark'

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PHASE: ${{ inputs.phase || 'preflight' }}
      SOURCE: ${{ inputs.source || 'ppomppu' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run bounded public fetch sampling
        shell: bash
        run: |
          cat > /tmp/source-preflight.mjs <<'NODE'
          const UA = 'Mozilla/5.0 (compatible; YakhuArchiveCrawler/0.1; personal archive)';
          const TIMEOUT = 12000;
          const DELAY = 350;
          const CONCURRENCY = 2;
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const SOURCES = {
            ppomppu: { root: 'https://www.ppomppu.co.kr/', preferred: /후방|약후|유머|자유|사진|비키니|화보|치어리더/i },
            bobaedream: { root: 'https://www.bobaedream.co.kr/', preferred: /후방주의|레이싱모델|연예|사진|움짤/i },
            mlbpark: { root: 'https://mlbpark.donga.com/', preferred: /불펜|bullpen|kbo|치어리더|화보|비키니|몸매|17금|ㅇㅎ/i },
          };
          const decode = (s) => s.replace(/&amp;/gi, '&').replace(/&quot;/gi, '"').replace(/&#39;|&apos;/gi, "'").replace(/<[^>]+>/g, ' ');
          const plain = (s) => decode(s).replace(/<script\\b[^>]*>[\\s\\S]*?<\\/script>/gi, ' ').replace(/<style\\b[^>]*>[\\s\\S]*?<\\/style>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/\\s+/g, ' ').trim();
          const getAttr = (s, n) => s.match(new RegExp('\\\\b' + n + '\\\\s*=\\\\s*["\\\\\']([^"\\\\\']+)["\\\\\']', 'i'))?.[1] || '';
          const abs = (raw, base) => { try { return new URL(decode(raw), base).href; } catch { return null; } };
          const gate = (status, html) => status === 401 || status === 403 || status === 429 || /성인\\s*(?:인증|전용)|본인\\s*인증|접근\\s*제한|captcha|cloudflare|ddos|security\\s*check/i.test((html.match(/<title[^>]*>[\\s\\S]*?<\\/title>/i)?.[0] || '') + html.slice(0, 5000));
          async function get(url, referer) {
            try {
              const r = await fetch(url, { headers: { 'user-agent': UA, 'accept-language': 'ko-KR,ko;q=0.9', referer }, redirect: 'follow', signal: AbortSignal.timeout(TIMEOUT) });
              return { status: r.status, url: r.url, html: await r.text() };
            } catch (e) { return { status: 0, url, html: '', error: e.message }; }
          }
          function anchors(html, base) {
            const out = [];
            for (const m of html.matchAll(/<a\\b([^>]*)>([\\s\\S]*?)<\\/a>/gi)) {
              const href = abs(getAttr(m[1], 'href'), base);
              if (!href) continue;
              out.push({ href, text: plain(m[2]).slice(0, 300), raw: m[0] });
            }
            return out;
          }
          function boardLinks(source, html, base) {
            const p = SOURCES[source].preferred;
            const all = anchors(html, base).filter((a) => new URL(a.href).hostname === new URL(base).hostname);
            const scored = all.map((a) => { let score = p.test(a.text + ' ' + a.href) ? 10 : 0; if (/board|bbs|zboard|community|mp\\/b|view|list/i.test(a.href)) score += 2; return { ...a, score }; }).filter((a) => a.score > 0).sort((a, b) => b.score - a.score);
            const seen = new Set();
            return scored.filter((a) => { if (seen.has(a.href)) return false; seen.add(a.href); return true; }).slice(0, 2);
          }
          function postUrl(source, href) {
            try {
              const u = new URL(href);
              if (source === 'ppomppu' && /view\\.php/i.test(u.pathname) && (u.searchParams.get('no') || u.searchParams.get('id'))) return u.href;
              if (source === 'bobaedream' && /view|article|board/i.test(u.pathname) && (u.searchParams.get('No') || u.searchParams.get('no') || u.searchParams.get('id'))) return u.href;
              if (source === 'mlbpark' && /\\/mp\\/b\\.php/i.test(u.pathname) && (u.searchParams.get('n') || u.searchParams.get('id'))) return u.href;
              if (/\\/(?:read|view|article)\\/\\d+/i.test(u.pathname)) return u.href;
            } catch {}
            return null;
          }
          function posts(source, html, base) {
            const map = new Map();
            for (const a of anchors(html, base)) {
              const url = postUrl(source, a.href); if (!url) continue;
              const title = (a.text || new URL(url).pathname).replace(/\\s+/g, ' ').trim();
              if (!title || title.length < 2) continue;
              const old = map.get(url); if (!old || title.length > old.title.length) map.set(url, { url, title });
            }
            return [...map.values()];
          }
          function media(source, html, base) {
            const out = [];
            for (const tag of html.matchAll(/<(?:img|video|source|a)\\b[^>]*>/gi)) {
              for (const m of tag[0].matchAll(/(?:src|data-src|data-original|href)=["']([^"']+)["']/gi)) {
                const u = abs(m[1], base); if (!u) continue;
                if (/\\.(?:jpe?g|png|gif|webp|mp4|webm)(?:[?#]|$)/i.test(u) || /(?:upload|attach|image|img|media|files|data)/i.test(u)) out.push(u);
              }
            }
            return [...new Set(out)].slice(0, 3);
          }
          function detailBody(source, html) {
            const scope = source === 'bobaedream' ? html.match(/<(?:div|article)\\b[^>]*(?:content|view|article)[^>]*>[\\s\\S]*?<\\/(?:div|article)>/i)?.[0] || html : html;
            return plain(scope).slice(0, 5000);
          }
          function classify(title, body, mediaCount) {
            const text = (title + '\\n' + body).trim();
            const negative = /미성년|청소년|교복|아동|몰카|도촬|유출|딥페이크|그림|일러스트|팬아트|애니|만화|게임|스크린샷|캡처|카톡|문자|밈|짤방|정치|사건|뉴스|광고|제품|남자|남성/i;
            const target = /비키니|수영복|화보|그라비아|맥심|치어리더|레이싱\\s*모델|여캠|인플루언서|바디\\s*프로필|룩북|직캠|셀카|인스타|여친룩|몸매|골반|각선미|여성\\s*모델|여배우|걸그룹/i;
            const person = /여자|여성|누나|눈나|아이돌|배우|가수|모델|인스타|셀카|사진|화보|직캠/i;
            if (negative.test(text)) return { label: 'NON_TARGET', reason: 'negative_context' };
            if (target.test(text) && mediaCount) return { label: 'TARGET', reason: 'women_visual_signal' };
            if (mediaCount && person.test(text)) return { label: 'AMBIGUOUS', reason: 'person_visual_needs_review' };
            return { label: 'NON_TARGET', reason: 'no_target_signal' };
          }
          async function probeMedia(source, rows) {
            const urls = [...new Set(rows.flatMap((r) => r.mediaUrls))].slice(0, 2); let success = 0; const results = [];
            for (const url of urls) {
              const referer = rows.find((r) => r.mediaUrls.includes(url))?.url || SOURCES[source].root;
              try { const r = await fetch(url, { method: 'GET', headers: { 'user-agent': UA, referer, range: 'bytes=0-31' }, redirect: 'follow', signal: AbortSignal.timeout(TIMEOUT) }); const ok = r.status >= 200 && r.status < 300 && /^image\\/|^video\\//i.test(r.headers.get('content-type') || ''); if (r.body) await r.body.cancel(); if (ok) success++; results.push({ status: r.status, contentType: r.headers.get('content-type') || null, redirect: r.url !== url }); } catch (e) { results.push({ error: e.message }); }
              await sleep(250);
            }
            return { tested: urls.length, success, results };
          }
          async function mapLimit(items, limit, worker) { const out = new Array(items.length); let next = 0; async function run() { while (true) { const i = next++; if (i >= items.length) return; out[i] = await worker(items[i], i); } } await Promise.all(Array.from({ length: Math.min(limit, items.length) }, run)); return out; }
          async function discover(source) {
            const cfg = SOURCES[source]; const root = await get(cfg.root, cfg.root); const statusCounts = { '403': 0, '429': 0, challenge: 0 };
            if (root.status === 403) statusCounts['403']++; if (root.status === 429) statusCounts['429']++; if (gate(root.status, root.html) && root.status !== 200) statusCounts.challenge++;
            const boards = root.status >= 200 && root.status < 300 && !gate(root.status, root.html) ? boardLinks(source, root.html, root.url) : [];
            return { cfg, root, boards, statusCounts };
          }
          async function preflight(source) {
            const d = await discover(source); const cfg = d.cfg; let listOk = 0, listFail = 0, discovered = 0, duplicateListings = 0; const postMap = new Map(); const listUrls = d.boards.length ? d.boards.map((x) => x.href) : [];
            for (const url of listUrls.slice(0, 2)) { const r = await get(url, cfg.root); if (r.status >= 200 && r.status < 300 && !gate(r.status, r.html)) { listOk++; for (const p of posts(source, r.html, r.url)) { discovered++; if (postMap.has(p.url)) duplicateListings++; else postMap.set(p.url, p); } } else { listFail++; if (r.status === 403) d.statusCounts['403']++; if (r.status === 429) d.statusCounts['429']++; if (gate(r.status, r.html)) d.statusCounts.challenge++; } }
            const unique = [...postMap.values()]; let detailRequested = 0, detailSuccess = 0, detailFailure = 0, auth = false; const details = [];
            for (const p of unique.slice(0, 3)) { detailRequested++; const r = await get(p.url, p.url); if (r.status >= 200 && r.status < 300 && !gate(r.status, r.html)) { detailSuccess++; const mediaUrls = media(source, r.html, r.url); details.push({ ...p, mediaUrls, body: detailBody(source, r.html) }); } else { detailFailure++; auth = auth || r.status === 401 || /로그인\\s*후|성인\\s*(?:인증|전용)|본인\\s*인증/i.test(r.html); if (r.status === 403) d.statusCounts['403']++; if (r.status === 429) d.statusCounts['429']++; if (gate(r.status, r.html)) d.statusCounts.challenge++; } await sleep(DELAY); }
            const mediaDetected = details.filter((x) => x.mediaUrls.length).length; const mediaTest = await probeMedia(source, details.filter((x) => x.mediaUrls.length));
            const blocked = d.root.status === 403 || d.root.status === 429 || d.statusCounts.challenge > 0; const notEligible = auth || /성인\\s*(?:인증|전용)|본인\\s*인증/i.test(d.root.html); const status = notEligible ? 'NOT_ELIGIBLE' : blocked ? 'BLOCKED' : listOk && detailSuccess && mediaDetected ? 'PASS' : listOk && detailSuccess ? 'PARTIAL' : 'BLOCKED';
            return { source, status, rootStatus: d.root.status, rootTitle: plain(d.root.html.match(/<title[^>]*>([\\s\\S]*?)<\\/title>/i)?.[1] || '').slice(0, 120), boards: d.boards.slice(0, 2).map((x) => ({ url: x.href, text: x.text })), listFetchSuccess: listOk, listFetchFailure: listFail, discovered, uniquePosts: unique.length, duplicateListings, detailRequested, detailSuccess, detailFailure, mediaDetected, mediaFetchTested: mediaTest.tested, mediaFetchSuccess: mediaTest.success, challenge: d.statusCounts.challenge, http403: d.statusCounts['403'], http429: d.statusCounts['429'], authOrAgeGate: notEligible, mediaProbe: mediaTest.results };
          }
          async function yieldSample(source) {
            const d = await discover(source); if (d.root.status < 200 || d.root.status >= 300 || gate(d.root.status, d.root.html)) return { source, status: 'BLOCKED', sampled: 0, reason: 'root_not_public' };
            const urls = d.boards.length ? d.boards.map((x) => x.href) : []; const map = new Map(); let listFetchSuccess = 0, listFetchFailure = 0, duplicateListings = 0;
            for (const base of urls.slice(0, 2)) { for (let page = 1; page <= 12 && map.size < 160; page++) { const u = new URL(base); if (page > 1 || !u.searchParams.has('page')) u.searchParams.set('page', String(page)); const r = await get(u.href, base); if (r.status >= 200 && r.status < 300 && !gate(r.status, r.html)) { listFetchSuccess++; for (const p of posts(source, r.html, r.url)) { if (map.has(p.url)) duplicateListings++; else if (map.size < 160) map.set(p.url, p); } } else { listFetchFailure++; if (r.status === 403 || r.status === 429 || gate(r.status, r.html)) break; } await sleep(DELAY); } }
            const all = [...map.values()].slice(0, 160); let detailRequested = 0, detailSuccess = 0, detailFailure = 0; const rows = (await mapLimit(all, CONCURRENCY, async (p) => { await sleep(DELAY); detailRequested++; const r = await get(p.url, p.url); if (r.status < 200 || r.status >= 300 || gate(r.status, r.html)) { detailFailure++; return { ...p, mediaUrls: [], body: '', label: 'NON_TARGET', reason: 'detail_unavailable' }; } detailSuccess++; const mediaUrls = media(source, r.html, r.url); const body = detailBody(source, r.html); const c = classify(p.title, body, mediaUrls.length); return { ...p, mediaUrls, body, ...c }; })).filter(Boolean);
            const counts = { TARGET: rows.filter((x) => x.label === 'TARGET').length, AMBIGUOUS: rows.filter((x) => x.label === 'AMBIGUOUS').length, NON_TARGET: rows.filter((x) => x.label === 'NON_TARGET').length }; const dates = rows.map((x) => Date.parse((x.body.match(/20\\d{2}[-./]\\d{1,2}[-./]\\d{1,2}/) || [])[0] || '')).filter(Number.isFinite); const spanHours = dates.length > 1 ? Math.max((Math.max(...dates) - Math.min(...dates)) / 3600000, 1) : null; const perDay = (n) => spanHours ? Number((n * 24 / spanHours).toFixed(3)) : null;
            const sample = (label, n) => rows.filter((x) => x.label === label).slice(0, n).map((x) => ({ title: x.title, url: x.url, mediaCount: x.mediaUrls.length, reason: x.reason }));
            return { source, status: 'PASS_SAMPLE', listFetchSuccess, listFetchFailure, discovered: all.length + duplicateListings, uniquePosts: all.length, duplicateListings, detailRequested, detailSuccess, detailFailure, mediaDetected: rows.filter((x) => x.mediaUrls.length).length, TARGET: counts.TARGET, AMBIGUOUS: counts.AMBIGUOUS, NON_TARGET: counts.NON_TARGET, targetYield: all.length ? Number((counts.TARGET / all.length).toFixed(4)) : null, potentialYield: all.length ? Number(((counts.TARGET + counts.AMBIGUOUS) / all.length).toFixed(4)) : null, targetPerDay: perDay(counts.TARGET), potentialPerDay: perDay(counts.TARGET + counts.AMBIGUOUS), targetSamples: sample('TARGET', 5), ambiguousSamples: sample('AMBIGUOUS', 5), nonTargetSamples: sample('NON_TARGET', 5), notes: 'No media bytes saved; metadata/text triage only.' };
          }
          const phase = process.env.PHASE || 'preflight'; const source = process.env.SOURCE || 'ppomppu'; const result = phase === 'yield' ? await yieldSample(source) : { phase, results: await Promise.all(Object.keys(SOURCES).map(preflight)) }; console.log(JSON.stringify(result));
          NODE
          node /tmp/source-preflight.mjs
